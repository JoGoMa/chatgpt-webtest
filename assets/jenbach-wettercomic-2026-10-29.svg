<!-- Speech balloons -->
<g font-family="system-ui,sans-serif" fill="#25394c" text-anchor="middle" font-weight="700" font-size="20">
<path d="M59 258Q59 235 82 235H348Q370 235 370 258V364Q370 386 348 386H230L209 413 198 386H82Q59 386 59 364Z" fill="#fffdf7" stroke="#30485a" stroke-width="4"/>
<text x="215" y="278"><tspan x="215">„Der Nebel hat</tspan><tspan x="215" dy="30">das Tal gebucht.</tspan><tspan x="215" dy="30">Ohne Aussicht!“</tspan></text>
<path d="M450 267Q450 244 473 244H729Q751 244 751 267V355Q751 378 729 378H627L611 405 596 378H473Q450 378 450 355Z" fill="#fffdf7" stroke="#30485a" stroke-width="4"/>
<text x="600" y="282"><tspan x="600">„Sonne und Wolken</tspan><tspan x="600" dy="30">teilen sich heute</tspan><tspan x="600" dy="30">den Schreibtisch!“</tspan></text>
<path d="M833 262Q833 239 856 239H1128Q1151 239 1151 262V363Q1151 385 1128 385H1029L1012 411 995 385H856Q833 385 833 363Z" fill="#fffdf7" stroke="#30485a" stroke-width="4"/>
<text x="990" y="281"><tspan x="990">„Feierabend für</tspan><tspan x="990" dy="30">die Sonne?</tspan><tspan x="990" dy="30">Ich übernehme!“</tspan></text>
</g>
