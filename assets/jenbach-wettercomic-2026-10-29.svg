<text x="600" y="754" font-family="system-ui,sans-serif" text-anchor="middle" font-size="17" fill="#3e5865">Humorvolle Illustration zur Prognose · mögliche Nebelfelder, zeitweise Wolken und Sonne · eigene Zeichnung</text>
