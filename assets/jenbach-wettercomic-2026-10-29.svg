<rect x="436" y="174" width="329" height="49" rx="13" fill="#fff6e2" stroke="#3b5261" stroke-width="3"/><text x="600" y="207">TAGSÜBER · SONNENFENSTER</text>
<rect x="826" y="174" width="329" height="49" rx="13" fill="#fff6e2" stroke="#3b5261" stroke-width="3"/><text x="990" y="207">ABENDS · EULENSCHICHT</text>
