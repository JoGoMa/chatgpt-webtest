<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
<title id="title">Die Eule und das Herbst-Update – Jenbach, 28. Oktober 2026</title>
<desc id="desc">Humorvoller Wettercomic: Eine Eule mit gelben Gummistiefeln und einem Schirm begegnet einer grauen Regenwolke. Die Wolke kündigt Regen am Nachmittag an. Im Hintergrund die Tiroler Berge.</desc>
